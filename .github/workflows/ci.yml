name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  required:
    name: CI / required
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements-local.lock
    - run: python -m automation.policy
    - name: Install checksum-pinned kubectl for offline Kustomize rendering
      run: python scripts/install_local_ci_kubectl.py
    - name: Offline release, policy and image ownership checks
      run: python -m unittest discover -s tests -p 'test_*.py'
    - name: Check local contracts and protect production desired state
      run: python -m localdev.checks
    - name: Render separate local and production roots without a cluster
      run: |
        kubectl kustomize environments/local/platform > /tmp/maintai-local-platform.yaml
        kubectl kustomize environments/local/observability > /tmp/maintai-local-observability.yaml
        kubectl kustomize environments/local/apps > /tmp/maintai-local-apps.yaml
        kubectl kustomize applications > /tmp/maintai-production-applications.yaml
        kubectl kustomize environments/production/workloads > /tmp/maintai-production-workloads.yaml
    - name: Read the reviewed application revision
      id: app_source
      run: |
        python - <<'PYTHON'
        import json, os, re
        from pathlib import Path
        lock = json.loads(Path("config/local/app-source.lock.json").read_text())
        sha = lock["source_git_sha"]
        assert lock["source_repository"] == "chiendz11/MaintAI"
        assert re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", sha)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("sha=" + sha + "\n")
        PYTHON
    - name: Check out the pinned public application source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: chiendz11/MaintAI
        ref: ${{ steps.app_source.outputs.sha }}
        path: .ci-app
        persist-credentials: false
    - name: Verify application Git revision and reviewed file hashes
      run: python -m localdev.checks --app-root .ci-app
