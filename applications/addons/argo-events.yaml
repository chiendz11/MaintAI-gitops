apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-argo-events
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-40'
spec:
  project: maintai-production
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-events
    targetRevision: 2.4.24
    helm:
      releaseName: argo-events
      valuesObject: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
