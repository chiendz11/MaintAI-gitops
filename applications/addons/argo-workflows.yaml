apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-40'
spec:
  project: maintai-production
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 2.0.2
    helm:
      releaseName: argo-workflows
      valuesObject:
        controller:
          workflowNamespaces:
          - argo
          metricsConfig:
            enabled: true
        server:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
