apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-40'
spec:
  project: maintai-production
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      releaseName: external-dns
      valuesObject:
        provider:
          name: aws
        sources:
        - ingress
        policy: upsert-only
        domainFilters:
        - REPLACE_WITH_DOMAIN
        txtOwnerId: maintai-v13-production
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: REPLACE_WITH_EXTERNAL_DNS_ROLE
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
