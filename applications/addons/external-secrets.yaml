apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-40'
spec:
  project: maintai-production
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.9.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: REPLACE_WITH_EXTERNAL_SECRETS_ROLE
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
