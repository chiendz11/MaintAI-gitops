apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-strimzi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-40'
spec:
  project: maintai-production
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.47.0
    helm:
      releaseName: strimzi
      valuesObject:
        watchNamespaces:
        - maintai
        watchAnyNamespace: false
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
