apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-local-argo-events
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-35'
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  project: maintai-local
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-events
    targetRevision: 2.4.24
    helm:
      releaseName: argo-events
      valuesObject: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
