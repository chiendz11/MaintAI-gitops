apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-local-argo-workflows
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-35'
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  project: maintai-local
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-workflows
    targetRevision: 2.0.2
    helm:
      releaseName: argo-workflows
      valuesObject:
        controller:
          workflowNamespaces:
          - argo
          metricsConfig:
            enabled: true
        server:
          enabled: true
          authModes:
          - server
          secure: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
