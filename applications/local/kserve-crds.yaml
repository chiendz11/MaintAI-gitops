apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-local-kserve-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-35'
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  project: maintai-local
  source:
    repoURL: ghcr.io/kserve/charts
    chart: kserve-crd
    targetRevision: v0.18.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
