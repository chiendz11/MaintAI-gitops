apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-local-ml-serving
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  project: maintai-local
  source:
    repoURL: https://github.com/chiendz11/MaintAI-gitops.git
    targetRevision: main
    path: environments/local/ml-serving/workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: maintai-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
    retry:
      limit: 5
