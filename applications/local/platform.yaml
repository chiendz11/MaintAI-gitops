apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-local-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  project: maintai-local
  source:
    repoURL: https://github.com/chiendz11/MaintAI-gitops.git
    targetRevision: feat/pure-declarative-gitops
    path: environments/local/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: maintai-local
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - FailOnSharedResource=true
    - PruneLast=true
