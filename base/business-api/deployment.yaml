apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-api
  labels:
    app.kubernetes.io/name: business-api
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: business-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-api
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/identity-realm-sha256: 53ac8c62a8fb134b3652d41a1183493d19d40b4909d32566278ccd5ee012f9b0
        maintai.io/source-sha: 2df0a914287a86f3500731ba05a2ba866bbee160
        maintai.io/source-snapshot: 7798625728e8d03470b52c43badd8a65cc51c90b922f124265d5314df96e803a
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8003'
        maintai.io/history-config-sha256: 97b5a370483b2a0fabba6719cfb4ed9ca6bd0250f63770faf06359d1b75d7164
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: business-api
        image: registry.invalid/maintai-local/business-api:NOT_BUILT
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: business-api-config
        - secretRef:
            name: local-business-api-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tokens
          mountPath: /tokens
          readOnly: true
        - name: history-keys
          mountPath: /history
          readOnly: true
        command:
        - maintai-business-api
        ports:
        - containerPort: 8003
          name: http
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8003
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8003
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8003
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tokens
        secret:
          secretName: local-service-tokens
          defaultMode: 288
      - name: history-keys
        secret:
          secretName: local-business-history-keys
          defaultMode: 288
