apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-worker
  labels:
    app.kubernetes.io/name: business-worker
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: business-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-worker
        app.kubernetes.io/part-of: maintai-local
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8084'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: business-worker
        image: registry.invalid/maintai-local/business-consumer:NOT_BUILT
        imagePullPolicy: IfNotPresent
        command:
        - maintai-business-worker
        envFrom:
        - configMapRef:
            name: business-worker-config
        - secretRef:
            name: local-business-consumer-env
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tokens
          mountPath: /tokens
          readOnly: true
        ports:
        - containerPort: 8084
          name: http
        startupProbe:
          httpGet:
            path: /health/live
            port: 8084
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8084
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8084
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tokens
        secret:
          secretName: local-service-tokens
          defaultMode: 288
