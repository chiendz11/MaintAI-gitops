apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-connect
  labels:
    app.kubernetes.io/name: redpanda-connect
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda-connect
        app.kubernetes.io/part-of: maintai-local
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '4195'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redpanda-connect
        image: registry.invalid/maintai-local/ingestion-connect:NOT_BUILT
        imagePullPolicy: IfNotPresent
        args:
        - run
        - /etc/connect/connect.yaml
        envFrom:
        - configMapRef:
            name: redpanda-connect-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 4195
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /ready
            port: 4195
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ping
            port: 4195
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
