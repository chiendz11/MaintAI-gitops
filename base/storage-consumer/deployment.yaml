apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-consumer
  labels:
    app.kubernetes.io/name: storage-consumer
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-consumer
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/source-sha: 63a17fa19b6898ab877732cf4bbdf8beadab61b3
        maintai.io/source-snapshot: b18d93a6411b5a8576850e6557bd577407b886220848c791e00779ef8e248435
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8008'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: storage-consumer
        image: registry.invalid/maintai-local/storage-consumer:NOT_BUILT
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: storage-consumer-config
        - secretRef:
            name: local-storage-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tokens
          mountPath: /tokens
          readOnly: true
        command:
        - maintai-storage
        - serve
        ports:
        - containerPort: 8008
          name: http
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8008
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8008
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8008
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tokens
        secret:
          secretName: local-service-tokens
          defaultMode: 288
