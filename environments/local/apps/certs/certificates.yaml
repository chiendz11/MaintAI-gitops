apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-dev-tls
  namespace: maintai-local
spec:
  secretName: local-dev-tls
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: maintai-ca-issuer
    kind: Issuer
    group: cert-manager.io
  commonName: local-dev.maintai-local.svc.cluster.local
  dnsNames:
  - localhost
  - 127.0.0.1
  - business-api
  - business-api.maintai-local
  - business-api.maintai-local.svc
  - business-api.maintai-local.svc.cluster.local
  - processing-read-api
  - processing-read-api.maintai-local
  - processing-read-api.maintai-local.svc
  - processing-read-api.maintai-local.svc.cluster.local
  - keycloak
  - keycloak.maintai-local
  - keycloak.maintai-local.svc
  - keycloak.maintai-local.svc.cluster.local
  - ingestion-api
  - ingestion-api.maintai-local
  - ingestion-api.maintai-local.svc
  - ingestion-api.maintai-local.svc.cluster.local
  - sensor
  - sensor.maintai-local
  - sensor.maintai-local.svc
  - sensor.maintai-local.svc.cluster.local
  ipAddresses:
  - 127.0.0.1
---
