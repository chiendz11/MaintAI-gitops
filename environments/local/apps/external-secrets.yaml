apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: local-business-api-eso
  namespace: maintai-local
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: local-business-api-env
    creationPolicy: Merge
  data:
  - secretKey: BUSINESS_DATABASE_URL
    remoteRef:
      key: maintai/local/database
      property: BUSINESS_DATABASE_URL
---
