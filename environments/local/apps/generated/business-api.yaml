apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-api
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: business-api
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: business-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: business-api
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/identity-realm-sha256: 53ac8c62a8fb134b3652d41a1183493d19d40b4909d32566278ccd5ee012f9b0
        maintai.io/source-sha: 2df0a914287a86f3500731ba05a2ba866bbee160
        maintai.io/source-snapshot: 7798625728e8d03470b52c43badd8a65cc51c90b922f124265d5314df96e803a
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8003'
        maintai.io/history-config-sha256: df582f775ee023b5feb4a7142c64516b43125236f22e88bc4d2668d29889c6b0
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: business-api
        image: registry.invalid/maintai-local/business-api:NOT_BUILT
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: business-api-config
        - secretRef:
            name: local-business-api-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tokens
          mountPath: /tokens
          readOnly: true
        - name: history-keys
          mountPath: /history
          readOnly: true
        command:
        - maintai-business-api
        ports:
        - containerPort: 8003
          name: http
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8003
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8003
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8003
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      - name: local-adapter
        image: maintai-local/dev-tools:image-e5851d12a0c38a3c6155fe5edcd3649a5fabb701e7570fa7fea27182db6ce1c7
        imagePullPolicy: Never
        args:
        - serve
        volumeMounts: &id001
        - name: bridge-config
          mountPath: /config
          readOnly: true
        - name: tokens
          mountPath: /tokens
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: oidc-processing
          mountPath: /credentials/processing
          readOnly: true
        - name: history-jwks
          mountPath: /history-jwks
          readOnly: true
        resources: &id002
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
        securityContext: &id003
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: local-dev-tls
          defaultMode: 288
      - name: bridge-config
        configMap:
          name: business-api-bridge
      - name: tokens
        emptyDir:
          medium: Memory
      - name: oidc-processing
        secret:
          secretName: local-oidc-processing
          defaultMode: 288
      - name: history-jwks
        configMap:
          name: local-history-jwks
      - name: history-keys
        secret:
          secretName: local-business-history-keys
          defaultMode: 288
      initContainers:
      - name: initialize-service-tokens
        image: maintai-local/dev-tools:image-e5851d12a0c38a3c6155fe5edcd3649a5fabb701e7570fa7fea27182db6ce1c7
        imagePullPolicy: Never
        args:
        - tokens-once
        volumeMounts: *id001
        resources: *id002
        securityContext: *id003
---
apiVersion: v1
kind: Service
metadata:
  name: business-api
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: business-api
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app.kubernetes.io/name: business-api
  ports:
  - name: http
    port: 8003
    targetPort: 8003
  - name: history-jwks
    port: 18091
    targetPort: 18091
