apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: maintai-local
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlflow
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: maintai-local
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.19.0
        command:
        - mlflow
        - server
        args:
        - --host
        - 0.0.0.0
        - --port
        - "5000"
        - --backend-store-uri
        - sqlite:////tmp/mlflow.db
        - --artifacts-destination
        - /tmp/artifacts
        env:
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        ports:
        - name: http
          containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi

