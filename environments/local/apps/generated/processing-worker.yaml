apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: processing-worker
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: processing-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processing-worker
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/identity-realm-sha256: 53ac8c62a8fb134b3652d41a1183493d19d40b4909d32566278ccd5ee012f9b0
        maintai.io/source-sha: 5b4664bb24e9f107c00a83e1faffb72fc5c1f4e3
        maintai.io/source-snapshot: e449b3c92f7ee1e6ca34504d9d5a6db947e45f2600a2d59861409587c9c41fcc
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8081'
        maintai.io/risk-policy-version: demo-risk-v1
        maintai.io/risk-policy-sha256: 25ec9dc4a1178bee4b560349c88dbb6b25fe7615f99884b5b8cc1e2f4963c08c
        maintai.io/risk-policy-source-sha: 2df0a914287a86f3500731ba05a2ba866bbee160
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: processing-worker
        image: registry.invalid/maintai-local/processing-worker:NOT_BUILT
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: processing-worker-config
        - secretRef:
            name: local-processing-worker-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: risk-policy
          mountPath: /local/config
          readOnly: true
        - name: tokens
          mountPath: /tokens
          readOnly: true
        - name: fixtures
          mountPath: /local/fixtures
          readOnly: true
        command:
        - maintai-processing-worker
        ports:
        - containerPort: 8081
          name: http
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      - name: local-adapter
        image: registry.invalid/maintai-local/dev-tools:NOT_BUILT
        imagePullPolicy: Never
        args:
        - serve
        volumeMounts:
        - name: bridge-config
          mountPath: /config
          readOnly: true
        - name: tokens
          mountPath: /tokens
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: oidc-registry
          mountPath: /credentials/registry
          readOnly: true
        - name: oidc-ml
          mountPath: /credentials/ml
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: local-dev-tls
          defaultMode: 288
      - name: risk-policy
        configMap:
          name: processing-risk-policy
      - name: bridge-config
        configMap:
          name: processing-worker-bridge
      - name: tokens
        emptyDir:
          medium: Memory
      - name: oidc-registry
        secret:
          secretName: local-oidc-registry
          defaultMode: 288
      - name: oidc-ml
        secret:
          secretName: local-oidc-ml
          defaultMode: 288
      - name: fixtures
        hostPath:
          path: /mnt/maintai-local/fixtures
          type: Directory
      - name: artifact-lock
        configMap:
          name: processing-worker-artifacts
      initContainers:
      - name: verify-artifact-checksums
        image: registry.invalid/maintai-local/dev-tools:NOT_BUILT
        imagePullPolicy: Never
        args:
        - verify-files
        - --config
        - /artifact-lock/artifacts.json
        volumeMounts:
        - name: risk-policy
          mountPath: /local/config
          readOnly: true
        - name: fixtures
          mountPath: /local/fixtures
          readOnly: true
        - name: artifact-lock
          mountPath: /artifact-lock
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: processing-worker
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: processing-worker
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app.kubernetes.io/name: processing-worker
  ports:
  - name: http
    port: 8081
    targetPort: 8081
