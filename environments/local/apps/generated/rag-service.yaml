apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-service
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/source-sha: 5b4664bb24e9f107c00a83e1faffb72fc5c1f4e3
        maintai.io/source-snapshot: e449b3c92f7ee1e6ca34504d9d5a6db947e45f2600a2d59861409587c9c41fcc
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8002'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rag-service
        image: registry.invalid/maintai-local/rag-service:NOT_BUILT
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: rag-service-config
        - secretRef:
            name: local-rag-service-env
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: embedding-cache
          mountPath: /opt/maintai/model-cache
        - name: datasets
          mountPath: /local/datasets
          readOnly: true
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-groq
              key: GROQ_API_KEY
        ports:
        - containerPort: 8002
          name: http
        startupProbe:
          httpGet:
            path: /health/live
            port: 8002
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8002
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8002
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: local-dev-tls
          defaultMode: 288
      - name: embedding-cache
        persistentVolumeClaim:
          claimName: local-rag-embedding-cache
      - name: datasets
        hostPath:
          path: /mnt/maintai-local/datasets
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app.kubernetes.io/name: rag-service
  ports:
  - name: http
    port: 8002
    targetPort: 8002
