apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: sensor
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sensor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sensor
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/identity-realm-sha256: 53ac8c62a8fb134b3652d41a1183493d19d40b4909d32566278ccd5ee012f9b0
        maintai.io/source-sha: 5b4664bb24e9f107c00a83e1faffb72fc5c1f4e3
        maintai.io/source-snapshot: e449b3c92f7ee1e6ca34504d9d5a6db947e45f2600a2d59861409587c9c41fcc
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8005'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sensor
        image: registry.invalid/maintai-local/sensor:NOT_BUILT
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: sensor-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tokens
          mountPath: /tokens
          readOnly: true
        - name: datasets
          mountPath: /local/datasets
          readOnly: true
        - name: sensor-client
          mountPath: /credentials/sensor
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: state
          mountPath: /state
        command:
        - maintai-sensor
        - serve
        ports:
        - containerPort: 8005
          name: http
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8005
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8005
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8005
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      - name: local-adapter
        image: registry.invalid/maintai-local/dev-tools:NOT_BUILT
        imagePullPolicy: Never
        args:
        - serve
        volumeMounts:
        - name: bridge-config
          mountPath: /config
          readOnly: true
        - name: tokens
          mountPath: /tokens
        - name: tls
          mountPath: /tls
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: local-dev-tls
          defaultMode: 288
      - name: bridge-config
        configMap:
          name: sensor-bridge
      - name: tokens
        emptyDir:
          medium: Memory
      - name: datasets
        hostPath:
          path: /mnt/maintai-local/datasets
          type: Directory
      - name: sensor-client
        secret:
          secretName: local-oidc-sensor
          defaultMode: 288
      - name: state
        persistentVolumeClaim:
          claimName: local-sensor-state
      - name: artifact-lock
        configMap:
          name: sensor-artifacts
      initContainers:
      - name: verify-artifact-checksums
        image: registry.invalid/maintai-local/dev-tools:NOT_BUILT
        imagePullPolicy: Never
        args:
        - verify-files
        - --config
        - /artifact-lock/artifacts.json
        volumeMounts:
        - name: datasets
          mountPath: /local/datasets
          readOnly: true
        - name: artifact-lock
          mountPath: /artifact-lock
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sensor
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: sensor
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app.kubernetes.io/name: sensor
  ports:
  - name: http
    port: 8005
    targetPort: 8005
