apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-ui
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: simulator-ui
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: simulator-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: simulator-ui
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/source-sha: 5b4664bb24e9f107c00a83e1faffb72fc5c1f4e3
        maintai.io/source-snapshot: e449b3c92f7ee1e6ca34504d9d5a6db947e45f2600a2d59861409587c9c41fcc
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'false'
        prometheus.io/port: '8080'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: simulator-ui
        image: registry.invalid/maintai-local/simulator-ui:NOT_BUILT
        imagePullPolicy: Never
        envFrom: []
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: runtime-config
          mountPath: /usr/share/nginx/html/runtime-config.json
          subPath: runtime-config.json
          readOnly: true
        ports:
        - containerPort: 8080
          name: http
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: local-dev-tls
          defaultMode: 288
      - name: runtime-config
        configMap:
          name: simulator-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: simulator-ui
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: simulator-ui
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app.kubernetes.io/name: simulator-ui
  ports:
  - name: http
    port: 8080
    targetPort: 8080
