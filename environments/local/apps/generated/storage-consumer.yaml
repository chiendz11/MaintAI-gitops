apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-consumer
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: storage-consumer
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-consumer
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/source-sha: 5b4664bb24e9f107c00a83e1faffb72fc5c1f4e3
        maintai.io/source-snapshot: e449b3c92f7ee1e6ca34504d9d5a6db947e45f2600a2d59861409587c9c41fcc
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8008'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: storage-consumer
        image: registry.invalid/maintai-local/storage-consumer:NOT_BUILT
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: storage-consumer-config
        - secretRef:
            name: local-storage-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: tokens
          mountPath: /tokens
          readOnly: true
        command:
        - maintai-storage
        - serve
        ports:
        - containerPort: 8008
          name: http
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8008
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8008
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8008
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
      - name: local-adapter
        image: registry.invalid/maintai-local/dev-tools:NOT_BUILT
        imagePullPolicy: Never
        args:
        - serve
        volumeMounts:
        - name: bridge-config
          mountPath: /config
          readOnly: true
        - name: tokens
          mountPath: /tokens
        - name: tls
          mountPath: /tls
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: tmp
        emptyDir: {}
      - name: tls
        secret:
          secretName: local-dev-tls
          defaultMode: 288
      - name: bridge-config
        configMap:
          name: storage-consumer-bridge
      - name: tokens
        emptyDir:
          medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: storage-consumer
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: storage-consumer
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app.kubernetes.io/name: storage-consumer
  ports:
  - name: http
    port: 8008
    targetPort: 8008
