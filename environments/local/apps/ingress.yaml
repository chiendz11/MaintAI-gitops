apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintai-ingress
  namespace: maintai-local
  annotations:
    kubernetes.io/ingress.class: alb
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: alb
  rules:
  - host: app.maintai.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: business-api
            port:
              number: 8003
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
  - host: simulator.maintai.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sensor
            port:
              number: 8005
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simulator-ui
            port:
              number: 8080
  - host: api.maintai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: business-api
            port:
              number: 8003
  - host: ingest.maintai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ingestion-api
            port:
              number: 8001
  - host: processing.maintai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: processing-read-api
            port:
              number: 8004
