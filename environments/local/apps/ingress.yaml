apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintai-ingress
  namespace: maintai-local
  annotations:
    kubernetes.io/ingress.class: alb
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: alb
  tls:
  - hosts:
    - app.maintai.localhost
    - simulator.maintai.localhost
    - auth.maintai.localhost
    - api.maintai.localhost
    - processing.maintai.localhost
    - grafana.maintai.localhost
    - mlflow.maintai.localhost
    - prometheus.maintai.localhost
    - minio.maintai.localhost
    - minio-console.maintai.localhost
    - app.maintai.local
    - simulator.maintai.local
    - auth.maintai.local
    - api.maintai.local
    - processing.maintai.local
    - grafana.maintai.local
    - mlflow.maintai.local
    - prometheus.maintai.local
    - minio.maintai.local
    - minio-console.maintai.local
    secretName: maintai-ingress-tls
  rules:
  - host: app.maintai.localhost
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: business-api
            port:
              number: 8003
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
  - host: app.maintai.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: business-api
            port:
              number: 8003
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
  - host: simulator.maintai.localhost
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sensor
            port:
              number: 8005
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simulator-ui
            port:
              number: 8080
  - host: simulator.maintai.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sensor
            port:
              number: 8005
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simulator-ui
            port:
              number: 8080
  - host: auth.maintai.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
  - host: auth.maintai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
  - host: api.maintai.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: business-api
            port:
              number: 8003
  - host: api.maintai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: business-api
            port:
              number: 8003
  - host: processing.maintai.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: processing-read-api
            port:
              number: 8004
  - host: processing.maintai.local
    http:
      paths:
