patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ml-service
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: ml-service
      $patch: delete
  - target:
      kind: Deployment
    patch: "- op: replace\n  path: /spec/template/spec/containers/0/imagePullPolicy\n  value: IfNotPresent"
  - target:
      kind: Deployment
      name: ingestion-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
  - target:
      kind: Deployment
      name: processing-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: oidc-registry
          mountPath: /credentials/registry
          readOnly: true
  - target:
      kind: Deployment
      name: business-api
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: oidc-processing
          secret:
            secretName: local-oidc-processing
            defaultMode: 288
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: oidc-processing
          mountPath: /credentials/processing
          readOnly: true
  - target:
      kind: Deployment
      name: business-consumer
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: oidc-processing
          secret:
            secretName: local-oidc-processing
            defaultMode: 288
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: oidc-processing
          mountPath: /credentials/processing
          readOnly: true
  - target:
      kind: Deployment
      name: processing-outbox-relay
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
