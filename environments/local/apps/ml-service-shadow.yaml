apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service-shadow
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: ml-service-shadow
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 4
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-service-shadow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-service-shadow
        app.kubernetes.io/part-of: maintai-local
      annotations:
        maintai.io/source-sha: 5b4664bb24e9f107c00a83e1faffb72fc5c1f4e3
        maintai.io/source-snapshot: e449b3c92f7ee1e6ca34504d9d5a6db947e45f2600a2d59861409587c9c41fcc
        maintai.io/source-dirty: 'false'
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8001'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ml-service-shadow
        image: registry.invalid/maintai-local/ml-service-shadow:NOT_BUILT
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ml-service-shadow-config
        - secretRef:
            name: local-ml-service-env
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: models
          mountPath: /local/models
          readOnly: true
        ports:
        - containerPort: 8001
          name: http
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8001
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8001
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8001
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: tmp
        emptyDir: {}
      - name: models
        emptyDir: {}
      - name: artifact-lock
        configMap:
          name: ml-service-shadow-artifacts
      initContainers:
      - name: fetch-and-verify-models
        image: registry.invalid/maintai/automation:NOT_BUILT
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - maintai_automation
        args:
        - fetch-artifacts
        - --config
        - /artifact-lock/artifacts.json
        envFrom:
        - configMapRef:
            name: ml-service-shadow-config
        - secretRef:
            name: local-ml-service-env
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: models
          mountPath: /local/models
        - name: artifact-lock
          mountPath: /artifact-lock
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service-shadow
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: ml-service-shadow
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app.kubernetes.io/name: ml-service-shadow
  ports:
  - name: http
    port: 8001
    targetPort: 8001
