apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-service-mirror-config
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: ml-service-mirror
    app.kubernetes.io/part-of: maintai-local
data:
  default.conf: |
    split_clients "$msec$connection_requests" $shadow_sample {
      20% 1;
      *   0;
    }

    upstream champion_backend {
      server ml-service.maintai-local.svc.cluster.local:8001;
      keepalive 64;
      keepalive_requests 50;
    }

    upstream shadow_backend {
      server ml-service-shadow.maintai-local.svc.cluster.local:8001;
      keepalive 32;
      keepalive_requests 25;
    }

    server {
      listen 8001;

      location = /health/live {
        access_log off;
        return 200 "ok\n";
      }

      location = /health/ready {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        mirror /_shadow;
        mirror_request_body on;
        proxy_pass http://champion_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
      }

      location = /_shadow {
        internal;
        if ($shadow_sample = 0) {
          return 204;
        }
        proxy_pass http://shadow_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_pass_request_body on;
        proxy_ignore_client_abort on;
        proxy_connect_timeout 25ms;
        proxy_read_timeout 50ms;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service-mirror
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: ml-service-mirror
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-service-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-service-mirror
        app.kubernetes.io/part-of: maintai-local
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ml-service-mirror
        image: nginxinc/nginx-unprivileged:stable-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8001
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 1000m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8001
          periodSeconds: 5
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8001
          periodSeconds: 5
          timeoutSeconds: 2
      volumes:
      - name: nginx-conf
        configMap:
          name: ml-service-mirror-config
      - name: tmp
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service-mirror
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: ml-service-mirror
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app.kubernetes.io/name: ml-service-mirror
  ports:
  - name: http
    port: 8001
    targetPort: 8001
