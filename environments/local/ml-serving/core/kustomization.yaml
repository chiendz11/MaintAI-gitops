apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- https://github.com/knative/serving/releases/download/knative-v1.21.3/serving-core.yaml
- https://github.com/knative-extensions/net-kourier/releases/download/knative-v1.21.1/kourier.yaml
patches:
- target:
    kind: ConfigMap
    name: config-network
    namespace: knative-serving
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: config-network
      namespace: knative-serving
    data:
      ingress-class: "kourier.ingress.networking.knative.dev"
      default-external-scheme: "http"
- target:
    kind: ConfigMap
    name: config-features
    namespace: knative-serving
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: config-features
      namespace: knative-serving
    data:
      kubernetes.podspec-init-containers: "enabled"
      kubernetes.podspec-securitycontext: "enabled"
- target:
    kind: ConfigMap
    name: config-domain
    namespace: knative-serving
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: config-domain
      namespace: knative-serving
    data:
      svc.cluster.local: ""
- target:
    kind: ConfigMap
    name: config-observability
    namespace: knative-serving
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: config-observability
      namespace: knative-serving
    data:
      metrics-protocol: "prometheus"
      request-metrics-protocol: "prometheus"
- target:
    kind: Service
    name: kourier
    namespace: kourier-system
  patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: kourier
      namespace: kourier-system
    spec:
      type: ClusterIP
