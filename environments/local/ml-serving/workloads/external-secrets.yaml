apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ml-service-champion-artifacts-eso
  namespace: maintai-local
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: ml-service-champion-artifacts
    creationPolicy: Owner
    template:
      data:
        artifacts.json: '[{"bucket": "maintai-models", "key": "models/logreg-baseline-v0/pipeline.joblib", "version_id": "{{ .pipeline }}", "path": "/local/models/logreg-baseline-v0/pipeline.joblib", "sha256": "163967932a2c4774c55539cad4bb64099baa7d252e8f472261b6f672ade91f44"}, {"bucket": "maintai-models", "key": "models/logreg-baseline-v0/metadata.json", "version_id": "{{ .metadata }}", "path": "/local/models/logreg-baseline-v0/metadata.json", "sha256": "821b32a0f9db0ffe79dbc196c160732a3802eb349e48f52d905bd3713be1b9c8"}, {"bucket": "maintai-models", "key": "models/logreg-baseline-v0/evaluation.json", "version_id": "{{ .evaluation }}", "path": "/local/models/logreg-baseline-v0/evaluation.json", "sha256": "5c797c56ad4faeb84d3b2d44cb910c36242c20aa8bbdd501cb1f3b4b835038db"}, {"bucket": "maintai-models", "key": "models/logreg-baseline-v0/drift_reference.json", "version_id": "{{ .drift_reference }}", "path": "/local/models/logreg-baseline-v0/drift_reference.json", "sha256": "ba9cac5d5ebae48cd5b68fe8710758d53e3b976af4131bd2ea2e2d843d3fea71"}]'
  data:
  - secretKey: pipeline
    remoteRef:
      key: /maintai/local/models/champion_versions
      property: pipeline
  - secretKey: metadata
    remoteRef:
      key: /maintai/local/models/champion_versions
      property: metadata
  - secretKey: evaluation
    remoteRef:
      key: /maintai/local/models/champion_versions
      property: evaluation
  - secretKey: drift_reference
    remoteRef:
      key: /maintai/local/models/champion_versions
      property: drift_reference
