apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maintai-local
generatorOptions:
  disableNameSuffixHash: true
resources:
- external-secrets.yaml
- ml-service-kserve.yaml
- ml-serving-network-policies.yaml
- ml-service-champion-pdb.yaml
- ml-traffic-mirror.yaml
configMapGenerator:
- name: ml-service-champion-config
  literals:
  - AWS_DEFAULT_REGION=us-east-1
  - AWS_REGION=us-east-1
  - MAINTAI_LOCAL_ONLY=1
  - MKL_NUM_THREADS=1
  - MLFLOW_TRACKING_URI=http://mlflow:5000
  - MODEL_DIR=/local/models/logreg-baseline-v0
  - OMP_NUM_THREADS=1
  - OPENBLAS_NUM_THREADS=1
  - PRODUCER_GIT_SHA=5b4664bb24e9f107c00a83e1faffb72fc5c1f4e3
  - S3_ENDPOINT_URL=http://minio:9000
  - SERVICE_ROLE=champion
  - UVICORN_WORKERS=1
