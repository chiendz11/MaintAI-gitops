apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: maintai-local
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maintai-root-ca
  namespace: maintai-local
spec:
  isCA: true
  commonName: maintai-root-ca
  secretName: maintai-root-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: maintai-ca-issuer
  namespace: maintai-local
spec:
  ca:
    secretName: maintai-root-ca-secret
