apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: approved-dataset-webhook
  namespace: argo-events
spec:
  eventBusName: default
  service:
    ports:
    - port: 12000
      targetPort: 12000
  template:
    serviceAccountName: webhook-eventsource
  webhook:
    approved-datasets:
      endpoint: /approved-datasets
      method: POST
      port: '12000'
