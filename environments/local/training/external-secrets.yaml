apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: local-training-s3-eso
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-argo
  target:
    name: local-training-s3
    creationPolicy: Owner
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: maintai/local/training
      property: AWS_ACCESS_KEY_ID
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: maintai/local/training
      property: AWS_SECRET_ACCESS_KEY
  - secretKey: AWS_REGION
    remoteRef:
      key: maintai/local/training
      property: AWS_REGION
  - secretKey: AWS_DEFAULT_REGION
    remoteRef:
      key: maintai/local/training
      property: AWS_DEFAULT_REGION
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: local-gitops-pat-eso
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-argo
  target:
    name: local-gitops-pat
    creationPolicy: Owner
  data:
  - secretKey: GITHUB_USERNAME
    remoteRef:
      key: maintai/local/gitops
      property: username
  - secretKey: GITHUB_TOKEN
    remoteRef:
      key: maintai/local/gitops
      property: password
