apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-knative-kourier-to-kserve-predictor
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: ml-service-champion
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kourier-system
    ports:
    - protocol: TCP
      port: 8012
    - protocol: TCP
      port: 8013
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: knative-serving
    ports:
    - protocol: TCP
      port: 8012
    - protocol: TCP
      port: 8013
    - protocol: TCP
      port: 8022
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9091
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: knative-serving
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mirror-to-kourier-internal
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ml-service-mirror
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kourier-system
    ports:
    - protocol: TCP
      port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-knative-kserve
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: knative-serving
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 9091
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kserve
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
