apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../params
- accounts.yaml
- rbac.yaml
- context.yaml
- network-policy.yaml
- eventbus.yaml
- eventsource.yaml
- sensor.yaml
- workflow-template.yaml
replacements:
- source:
    kind: ConfigMap
    name: maintai-production-params
    fieldPath: data.AWS_REGION
  targets:
  - select:
      kind: EventSource
      name: approved-dataset-sqs
    fieldPaths:
    - spec.sqs.approved-datasets.region
- source:
    kind: ConfigMap
    name: maintai-production-params
    fieldPath: data.APPROVED_DATASET_QUEUE
  targets:
  - select:
      kind: EventSource
      name: approved-dataset-sqs
    fieldPaths:
    - spec.sqs.approved-datasets.queue
