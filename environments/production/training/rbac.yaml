apiVersion: v1
kind: List
items:
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: maintai-workflow-executor
    namespace: argo
  rules:
  - apiGroups:
    - argoproj.io
    resources:
    - workflowtaskresults
    verbs:
    - create
    - patch
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: maintai-workflow-executor
    namespace: argo
  subjects:
  - kind: ServiceAccount
    name: maintai-training
    namespace: argo
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: maintai-workflow-executor
- apiVersion: rbac.authorization.k8s.io/v1
  kind: Role
  metadata:
    name: dataset-submit
    namespace: argo
  rules:
  - apiGroups:
    - argoproj.io
    resources:
    - workflows
    verbs:
    - create
    - get
    - list
    - watch
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: dataset-submit
    namespace: argo
  subjects:
  - kind: ServiceAccount
    name: dataset-sensor
    namespace: argo-events
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: dataset-submit
