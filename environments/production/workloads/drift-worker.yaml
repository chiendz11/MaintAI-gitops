apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-worker
  namespace: maintai
  labels:
    app.kubernetes.io/name: drift-worker
    app.kubernetes.io/part-of: maintai
spec:
  suspend: true
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: drift-worker
            app.kubernetes.io/part-of: maintai
        spec:
          serviceAccountName: drift-worker
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
          - name: fetch-drift-reference
            image: registry.invalid/maintai/automation:NOT_BUILT
            imagePullPolicy: IfNotPresent
            command:
            - python
            - -m
            - maintai_automation
            args:
            - fetch-artifacts
            - --config
            - /artifact-lock/artifacts.json
            envFrom:
            - configMapRef:
                name: drift-worker-config
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models
            - name: artifact-lock
              mountPath: /artifact-lock
              readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
          containers:
          - name: drift-worker
            image: registry.invalid/maintai-local/drift-worker:NOT_BUILT
            imagePullPolicy: IfNotPresent
            args:
            - run
            - --output
            - /tmp/drift-report.json
            envFrom:
            - configMapRef:
                name: drift-worker-config
            - secretRef:
                name: drift-database
            env:
            - name: DRIFT_REFERENCE_PATH
              value: /models/champion/drift_reference.json
            - name: DRIFT_WINDOW_SIZE
              value: "500"
            - name: DRIFT_MINIMUM_SAMPLES
              value: "200"
            - name: DRIFT_WINDOW_LOOKBACK_HOURS
              value: "24"
            - name: DRIFT_S3_REQUIRED
              value: "true"
            - name: DRIFT_PUSHGATEWAY_REQUIRED
              value: "false"
            - name: DRIFT_OIDC_CLIENT_SECRET_FILE
              value: /oidc/client_secret
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models
              readOnly: true
            - name: oidc
              mountPath: /oidc
              readOnly: true
          volumes:
          - name: tmp
            emptyDir: {}
          - name: models
            emptyDir: {}
          - name: artifact-lock
            secret:
              secretName: ml-service-champion-artifacts
              defaultMode: 288
          - name: oidc
            secret:
              secretName: REPLACE_WITH_OIDC_PROCESSING_SECRET
              defaultMode: 288
