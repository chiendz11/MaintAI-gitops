# Production ExternalSecrets syncing from AWS Secrets Manager via IRSA ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: business-database-eso
  namespace: maintai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: business-database
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: maintai/v13/production/business-database
