apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ml-service-shadow-artifacts-eso
  namespace: maintai
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: ml-service-shadow-artifacts
    creationPolicy: Owner
  data:
  - secretKey: artifacts.json
    remoteRef:
      key: /maintai/v13/production/models/shadow_artifacts
