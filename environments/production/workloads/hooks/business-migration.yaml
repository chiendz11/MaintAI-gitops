apiVersion: batch/v1
kind: Job
metadata:
  name: business-db-migration
  namespace: maintai
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      name: business-db-migration
      labels:
        app.kubernetes.io/name: business-db-migration
        app.kubernetes.io/part-of: maintai
    spec:
      serviceAccountName: business-api
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: registry.invalid/maintai-local/business-api:NOT_BUILT
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          maintai-business-migrate upgrade && \
          python -c "import os,psycopg; from psycopg.rows import dict_row; from backend.shared.persistence.permissions import grant_business_permissions as grant
          with psycopg.connect(os.environ['BUSINESS_DATABASE_URL'], row_factory=dict_row) as c:
              grant(c, reader_role='business_reader', consumer_role='business_consumer', api_role='business_api')
              c.execute('GRANT SELECT,INSERT,UPDATE,DELETE ON history_marker_snapshots TO business_api')"
        env:
        - name: BUSINESS_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: business-database
              key: url
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
