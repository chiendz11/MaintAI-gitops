apiVersion: batch/v1
kind: Job
metadata:
  name: processing-db-migration
  namespace: maintai
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      name: processing-db-migration
      labels:
        app.kubernetes.io/name: processing-db-migration
        app.kubernetes.io/part-of: maintai
    spec:
      serviceAccountName: processing-worker
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migration
        image: registry.invalid/maintai-local/processing-worker:NOT_BUILT
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          maintai-processing-migrate upgrade && \
          python -c "import os,psycopg; from psycopg.rows import dict_row; from processing.shared.persistence.connection import grant_processing_permissions as grant
          with psycopg.connect(os.environ['PROCESSING_DATABASE_URL'], row_factory=dict_row) as c:
              grant(c, reader_role='processing_reader', worker_role='processing_worker', relay_role='processing_relay')" && \
          maintai-processing-migrate grant-history-metadata --metadata-role processing_history_meta
        env:
        - name: PROCESSING_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: processing-database
              key: url
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
