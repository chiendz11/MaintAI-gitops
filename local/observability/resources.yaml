apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: maintai-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    nodePort: 30900
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30000
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  selector:
    app: pushgateway
  ports:
  - name: http
    port: 9091
    targetPort: 9091
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  serviceName: prometheus
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
        args:
        - --config.file=/etc/prometheus/prometheus.yaml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=3d
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: data
          mountPath: /prometheus
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: local-prometheus
      serviceAccountName: prometheus
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  serviceName: grafana
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
        args: []
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: providers
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 5
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: local-grafana
              key: admin-password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
      volumes:
      - name: datasources
        configMap:
          name: local-grafana-datasources
      - name: providers
        configMap:
          name: local-grafana-providers
      - name: dashboards
        configMap:
          name: local-grafana-dashboards
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      automountServiceAccountToken: false
      containers:
      - name: pushgateway
        image: prom/pushgateway:v1.11.1@sha256:03738d278e082ee9821df730c741b3b465c251fc2b68a85883def301a55a6215
        ports:
        - containerPort: 9091
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
