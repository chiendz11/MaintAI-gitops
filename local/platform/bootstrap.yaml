apiVersion: batch/v1
kind: Job
metadata:
  name: local-postgres-bootstrap
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: bootstrap
        image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
        command:
        - sh
        - /bootstrap/postgres.sh
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: credentials
          mountPath: /secrets
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
      volumes:
      - name: bootstrap
        configMap:
          name: local-postgres-bootstrap
      - name: credentials
        secret:
          secretName: local-postgres-bootstrap
---
