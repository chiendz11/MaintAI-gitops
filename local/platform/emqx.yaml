apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/part-of: maintai-local
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: emqx
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
  - name: mqtts
    port: 8883
    targetPort: 8883
    nodePort: 30883
  - name: dashboard
    port: 18083
    targetPort: 18083
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  namespace: maintai-local
  labels:
    app.kubernetes.io/name: emqx
    app.kubernetes.io/part-of: maintai-local
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  serviceName: emqx
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: emqx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: emqx
        app.kubernetes.io/part-of: maintai-local
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: emqx
        image: emqx/emqx:5.8.6
        imagePullPolicy: IfNotPresent
        env:
        - name: EMQX_NODE__NAME
          value: emqx@127.0.0.1
        - name: EMQX_BROKER__SHARED_SUBSCRIPTION_STRATEGY
          value: hash_topic
        - name: EMQX_LISTENERS__TCP__DEFAULT__BIND
          value: 0.0.0.0:1883
        - name: EMQX_LISTENERS__SSL__DEFAULT__BIND
          value: 0.0.0.0:8883
        - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE
          value: /certs/mqtt/tls.crt
        - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE
          value: /certs/mqtt/tls.key
        - name: EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE
          value: /certs/mqtt/ca.crt
        - name: EMQX_DASHBOARD__LISTENERS__HTTP__BIND
          value: 0.0.0.0:18083
        ports:
        - name: mqtt
          containerPort: 1883
        - name: mqtts
          containerPort: 8883
        - name: dashboard
          containerPort: 18083
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: mqtt-tls
          mountPath: /certs/mqtt
          readOnly: true
        - name: data
          mountPath: /opt/emqx/data
        - name: log
          mountPath: /opt/emqx/log
        readinessProbe:
          tcpSocket:
            port: 1883
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 1883
          periodSeconds: 15
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: mqtt-tls
        secret:
          secretName: local-mqtt-tls
          optional: true
          defaultMode: 288
      - name: log
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
