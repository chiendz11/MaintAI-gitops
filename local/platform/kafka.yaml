apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
  annotations:
    argocd.argoproj.io/sync-wave: '-40'
spec:
  selector:
    app: kafka
  ports:
  - name: tcp
    port: 9092
    targetPort: 9092
  - name: controller
    port: 9093
    targetPort: 9093
  - name: external
    port: 19092
    targetPort: 19092
  clusterIP: None
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/part-of: maintai-local
    spec:
      automountServiceAccountToken: false
      containers:
      - name: kafka
        image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
        env:
        - name: KAFKA_NODE_ID
          value: '1'
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@kafka-0.kafka.maintai-local.svc.cluster.local:9093
        - name: KAFKA_LISTENERS
          value: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INTERNAL
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: '1'
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: '1'
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: '1'
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: 'false'
        - name: KAFKA_LOG_DIRS
          value: /var/lib/kafka/data
        - name: KAFKA_LOG_RETENTION_HOURS
          value: '168'
        - name: CLUSTER_ID
          valueFrom:
            secretKeyRef:
              name: local-kafka
              key: cluster_id
        ports:
        - containerPort: 9092
        - containerPort: 9093
        - containerPort: 19092
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        readinessProbe:
          tcpSocket:
            port: 9092
          periodSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            memory: 2Gi
      volumes: []
      securityContext:
        fsGroup: 1000
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
