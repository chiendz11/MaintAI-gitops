apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: maintai-local
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: '-50'
resources:
- ../../platform/namespaces/local
- postgres.yaml
- kafka.yaml
- minio.yaml
- keycloak.yaml
- idp-gateway.yaml
- bootstrap.yaml
configMapGenerator:
- name: local-keycloak-realm
  files:
  - maintai-realm.json
- name: local-idp-bridge
  files:
  - bridge.json=idp-bridge.json
- name: local-postgres-bootstrap
  files:
  - postgres.sh
  - roles.tsv
- name: local-kafka-topics
  files:
  - topics.sh
- name: local-minio-bootstrap
  files:
  - minio.sh
- name: local-minio-policies
  files:
  - policies/storage.json
  - policies/processing.json
  - policies/inference.json
  - policies/training.json
  - policies/rag.json
  - policies/drift.json
  - policies/mlflow.json
  - policies/processing-reader.json
