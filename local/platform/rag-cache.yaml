apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-rag-embedding-cache
  namespace: maintai-local
  labels:
    app.kubernetes.io/part-of: maintai-local
  annotations:
    # local-path waits for a consumer. Keep DB/bootstrap waves ahead of this
    # claim; the explicit knowledge-owner Job binds it before RAG is enabled.
    argocd.argoproj.io/sync-wave: '0'
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
