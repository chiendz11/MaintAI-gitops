apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-internal
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: maintai-kafka
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: strimzi
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keda
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - keda-operator
          - keda-operator-metrics-apiserver
    ports:
    - protocol: TCP
      port: 9093
  egress:
  - to:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: strimzi
