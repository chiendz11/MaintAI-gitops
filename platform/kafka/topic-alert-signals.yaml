apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: alert-signals
  namespace: maintai
  labels:
    strimzi.io/cluster: maintai-kafka
spec:
  topicName: alert.signals
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000
    cleanup.policy: delete
    min.insync.replicas: 2
    max.message.bytes: 1048576
