apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: maintai-ingestion
  namespace: maintai
  labels:
    strimzi.io/cluster: maintai-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: sensor.readings
        patternType: literal
      operations:
      - Write
      - Describe
    - resource:
        type: topic
        name: sensor.rejected
        patternType: literal
      operations:
      - Write
      - Describe
    - resource:
        type: cluster
      operations:
      - IdempotentWrite
