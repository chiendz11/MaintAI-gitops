apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: maintai-storage
  namespace: maintai
  labels:
    strimzi.io/cluster: maintai-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: sensor.readings
        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: topic
        name: sensor.rejected
        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: topic
        name: inference.results
        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: group
        name: raw-rejected-archive-v1
        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: group
        name: outcome-archive-v1
        patternType: literal
      operations:
      - Read
      - Describe
    - resource:
        type: group
        name: raw-archive-v1
        patternType: literal
      operations:
      - Read
      - Describe
