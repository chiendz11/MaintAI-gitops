apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argo
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ml-service
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 5432
