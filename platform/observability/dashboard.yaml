apiVersion: v1
kind: ConfigMap
metadata:
  name: maintai-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  maintai-pipeline.json: '{"title": "MaintAI pipeline", "uid": "maintai-pipeline-v1",
    "schemaVersion": 39, "version": 1, "panels": [{"type": "timeseries", "title":
    "Event to visible alert p95", "id": 1, "gridPos": {"h": 8, "w": 12, "x": 0, "y":
    0}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(maintai_event_to_alert_visible_duration_seconds_bucket[5m])))",
    "legendFormat": "p95"}]}, {"type": "timeseries", "title": "Outbox oldest pending
    event", "id": 2, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "targets": [{"expr":
    "maintai_outbox_oldest_pending_age_seconds"}]}], "time": {"from": "now-1h", "to":
    "now"}}'
