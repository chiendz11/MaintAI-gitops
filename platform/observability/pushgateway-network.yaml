apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pushgateway
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: drift-worker
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9091
