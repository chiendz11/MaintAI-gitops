apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: maintai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pushgateway
        image: registry.invalid/prom/pushgateway:UNCONFIGURED
        ports:
        - name: http
          containerPort: 9091
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
