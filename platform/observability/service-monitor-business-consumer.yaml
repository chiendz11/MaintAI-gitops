apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: business-consumer
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
    - maintai
  selector:
    matchLabels:
      app.kubernetes.io/name: business-consumer
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
