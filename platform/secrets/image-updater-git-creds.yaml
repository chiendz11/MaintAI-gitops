apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-git-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maintai-aws
    kind: ClusterSecretStore
  target:
    name: argocd-image-updater-git-creds
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_argocd-image-updater-git-creds
      property: username
  - secretKey: password
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_argocd-image-updater-git-creds
      property: password
