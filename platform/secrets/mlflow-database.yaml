apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-database
  namespace: maintai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maintai-aws
    kind: ClusterSecretStore
  target:
    name: mlflow-database
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_mlflow-database
      property: url
  - secretKey: username
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_mlflow-database
      property: username
  - secretKey: password
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_mlflow-database
      property: password
  - secretKey: credential_json
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_mlflow-database
      property: credential_json
