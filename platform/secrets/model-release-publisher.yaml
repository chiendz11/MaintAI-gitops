apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-release-publisher
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maintai-aws
    kind: ClusterSecretStore
  target:
    name: model-release-publisher
    creationPolicy: Owner
  data:
  - secretKey: app_id
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_model-release-publisher
      property: app_id
  - secretKey: installation_id
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_model-release-publisher
      property: installation_id
  - secretKey: private_key
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_model-release-publisher
      property: private_key
