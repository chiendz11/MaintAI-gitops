apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-bootstrap-admin
  namespace: maintai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maintai-aws
    kind: ClusterSecretStore
  target:
    name: postgres-bootstrap-admin
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: REPLACE_WITH_MASTER_SECRET_ARN
      property: username
  - secretKey: password
    remoteRef:
      key: REPLACE_WITH_MASTER_SECRET_ARN
      property: password
