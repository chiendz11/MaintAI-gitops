apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-api-auth
  namespace: maintai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maintai-aws
    kind: ClusterSecretStore
  target:
    name: rag-api-auth
    creationPolicy: Owner
  data:
  - secretKey: api_key
    remoteRef:
      key: REPLACE_WITH_SECRET_ARN_rag-api-auth
      property: api_key
