apiVersion: v1
kind: ConfigMap
metadata:
  name: business-consumer-config-35a2abce383d
  namespace: maintai
  labels:
    app.kubernetes.io/name: business-consumer
    app.kubernetes.io/part-of: maintai
immutable: true
data:
  LOG_LEVEL: INFO
  ENVIRONMENT: production
  KAFKA_BOOTSTRAP_SERVERS: maintai-kafka-kafka-bootstrap.maintai.svc:9093
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_SSL_CA_LOCATION: /etc/kafka/ca/ca.crt
  KAFKA_ENABLE_AUTO_COMMIT: 'false'
  TELEMETRY_GROUP_ID: business-live-v1
  PREDICTION_GROUP_ID: business-prediction-v1
  ALERT_GROUP_ID: business-alert-v1
  SSE_FANOUT: postgres-notify
