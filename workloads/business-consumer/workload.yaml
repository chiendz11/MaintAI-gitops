apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-consumer
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: business-consumer
    app.kubernetes.io/part-of: maintai
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        maintai.io/config-sha256: 35a2abce383dee7d7cee9358e030b948613c91022dc6c81bacae6957ed8fd898
        maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
    spec:
      serviceAccountName: business-consumer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: business-consumer
        image: registry.invalid/maintai/business-backend:UNCONFIGURED
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: kafka-ca
          mountPath: /etc/kafka/ca
          readOnly: true
        - name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
        command:
        - python
        - -m
        - maintai_business.consumer
        envFrom:
        - configMapRef:
            name: business-consumer-config-35a2abce383d
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: business-database
              key: url
        - name: KAFKA_SASL_USERNAME
          value: maintai-business
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maintai-business
              key: password
        ports:
        - name: http
          containerPort: 9100
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: tmp
        emptyDir: {}
      - name: kafka-ca
        secret:
          secretName: maintai-kafka-cluster-ca-cert
      - name: rds-ca
        configMap:
          name: aws-rds-ca
