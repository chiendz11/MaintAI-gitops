apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-worker
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: drift-worker
    app.kubernetes.io/part-of: maintai
spec:
  schedule: '*/15 * * * *'
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: *id001
          annotations:
            maintai.io/config-sha256: 0f40d0925b691f44898a9c48839cda6679d6eed32b0dfa60161fe43ac524ada4
            maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
        spec:
          serviceAccountName: drift-worker
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 90
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: drift-worker
            image: registry.invalid/maintai/drift-worker:UNCONFIGURED
            imagePullPolicy: IfNotPresent
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '1'
                memory: 1Gi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models/current
              readOnly: true
            - name: rds-ca
              mountPath: /etc/rds-ca
              readOnly: true
            command:
            - python
            - -m
            - maintai_drift.run
            envFrom:
            - configMapRef:
                name: drift-worker-config-0f40d0925b69
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: drift-database
                  key: url
            - name: PROCESSING_READ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: processing-api-auth
                  key: api_key
          volumes:
          - name: tmp
            emptyDir: {}
          - name: models
            emptyDir: {}
          - name: model-release
            configMap:
              name: maintai-model-release
          - name: rds-ca
            configMap:
              name: aws-rds-ca
          initContainers:
          - name: model-download
            image: registry.invalid/maintai/automation:UNCONFIGURED
            command:
            - python
            - -m
            - platform_runtime.artifacts
            - model
            - --lock
            - /release/model.json
            - --directory
            - /models/current
            volumeMounts:
            - name: models
              mountPath: /models/current
            - name: model-release
              mountPath: /release
              readOnly: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: '1'
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
          restartPolicy: Never
