apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestion-api
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingestion-api
      app.kubernetes.io/part-of: maintai
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: maintai
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argo
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          strimzi.io/cluster: maintai-kafka
    ports:
    - protocol: TCP
      port: 9093
