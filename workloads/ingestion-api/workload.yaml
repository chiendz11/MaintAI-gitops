apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-api
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: ingestion-api
    app.kubernetes.io/part-of: maintai
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        maintai.io/config-sha256: 713fee8678c2e1d895f151cc25b0fba6285ad5b3a8480dbd311aa4bf5609a484
        maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
    spec:
      serviceAccountName: ingestion-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ingestion-api
        image: registry.invalid/maintai/ingestion-api:UNCONFIGURED
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: kafka-ca
          mountPath: /etc/kafka/ca
          readOnly: true
        command:
        - python
        - -m
        - maintai_ingestion.api
        envFrom:
        - configMapRef:
            name: ingestion-api-config-713fee8678c2
        env:
        - name: INGESTION_API_KEY
          valueFrom:
            secretKeyRef:
              name: ingestion-auth
              key: api_key
        - name: PRODUCER_GIT_SHA
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['maintai.io/source-sha']
        - name: KAFKA_SASL_USERNAME
          value: maintai-ingestion
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maintai-ingestion
              key: password
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: tmp
        emptyDir: {}
      - name: kafka-ca
        secret:
          secretName: maintai-kafka-cluster-ca-cert
