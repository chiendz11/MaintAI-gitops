apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: maintai
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        maintai.io/config-sha256: a6b29fe84a7aae4d42504c59176e70b44258be0eff88a32f5dc99b78db4fcb47
        maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
    spec:
      serviceAccountName: ml-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ml-service
        image: registry.invalid/maintai/ml-service:UNCONFIGURED
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: models
          mountPath: /models/current
          readOnly: true
        command:
        - python
        - -m
        - maintai_ml.inference
        envFrom:
        - configMapRef:
            name: ml-service-config-a6b29fe84a7a
        env:
        - name: ML_API_KEY
          valueFrom:
            secretKeyRef:
              name: ml-api-auth
              key: api_key
        ports:
        - name: http
          containerPort: 8001
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: tmp
        emptyDir: {}
      - name: models
        emptyDir: {}
      - name: model-release
        configMap:
          name: maintai-model-release
      initContainers:
      - name: model-download
        image: registry.invalid/maintai/automation:UNCONFIGURED
        command:
        - python
        - -m
        - platform_runtime.artifacts
        - model
        - --lock
        - /release/model.json
        - --directory
        - /models/current
        volumeMounts:
        - name: models
          mountPath: /models/current
        - name: model-release
          mountPath: /release
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
