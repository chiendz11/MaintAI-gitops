apiVersion: v1
kind: ConfigMap
metadata:
  name: processing-outbox-relay-config-80c781fdee68
  namespace: maintai
  labels:
    app.kubernetes.io/name: processing-outbox-relay
    app.kubernetes.io/part-of: maintai
immutable: true
data:
  LOG_LEVEL: INFO
  ENVIRONMENT: production
  KAFKA_BOOTSTRAP_SERVERS: maintai-kafka-kafka-bootstrap.maintai.svc:9093
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_SSL_CA_LOCATION: /etc/kafka/ca/ca.crt
  KAFKA_ENABLE_AUTO_COMMIT: 'false'
  RESULT_TOPIC: inference.results
  ALERT_TOPIC: alert.signals
  OUTBOX_POLL_INTERVAL_MS: '100'
  OUTBOX_CLAIM_LEASE_SECONDS: '60'
