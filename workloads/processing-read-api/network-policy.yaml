apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: processing-read-api
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: processing-read-api
      app.kubernetes.io/part-of: maintai
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: maintai
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argo
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8004
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 5432
