apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-read-api
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: processing-read-api
    app.kubernetes.io/part-of: maintai
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        maintai.io/config-sha256: 7df9d78958eca7d513495ffb75f0ff5e1da285de6fe98b09ee5bfb4f610e269f
        maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
    spec:
      serviceAccountName: processing-read-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: processing-read-api
        image: registry.invalid/maintai/processing:UNCONFIGURED
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
        command:
        - python
        - -m
        - maintai_processing.read_api
        envFrom:
        - configMapRef:
            name: processing-read-api-config-7df9d78958ec
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: processing-database
              key: url
        - name: PROCESSING_READ_API_KEY
          valueFrom:
            secretKeyRef:
              name: processing-api-auth
              key: api_key
        ports:
        - name: http
          containerPort: 8004
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: tmp
        emptyDir: {}
      - name: rds-ca
        configMap:
          name: aws-rds-ca
