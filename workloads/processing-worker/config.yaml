apiVersion: v1
kind: ConfigMap
metadata:
  name: processing-worker-config-dbd46e3c142f
  namespace: maintai
  labels:
    app.kubernetes.io/name: processing-worker
    app.kubernetes.io/part-of: maintai
immutable: true
data:
  LOG_LEVEL: INFO
  ENVIRONMENT: production
  KAFKA_BOOTSTRAP_SERVERS: maintai-kafka-kafka-bootstrap.maintai.svc:9093
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_SSL_CA_LOCATION: /etc/kafka/ca/ca.crt
  KAFKA_ENABLE_AUTO_COMMIT: 'false'
  KAFKA_GROUP_ID: processing-v1
  KAFKA_TOPIC: sensor.readings
  ML_BASE_URL: http://ml-service:8001
  MACHINE_REGISTRY_BASE_URL: http://business-api:8003
  MODEL_DIR: /models/current
  ML_TIMEOUT_SECONDS: '2'
  ML_RETRY_LIMIT: '1'
