apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: processing-worker
    app.kubernetes.io/part-of: maintai
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        maintai.io/config-sha256: dbd46e3c142f5a67077d6362d2a9d69cda40f45663c6930d4876f07c7cdd47f7
        maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
    spec:
      serviceAccountName: processing-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: processing-worker
        image: registry.invalid/maintai/processing:UNCONFIGURED
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: kafka-ca
          mountPath: /etc/kafka/ca
          readOnly: true
        - name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
        command:
        - python
        - -m
        - maintai_processing.worker
        envFrom:
        - configMapRef:
            name: processing-worker-config-dbd46e3c142f
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: processing-database
              key: url
        - name: ML_API_KEY
          valueFrom:
            secretKeyRef:
              name: ml-api-auth
              key: api_key
        - name: KAFKA_SASL_USERNAME
          value: maintai-processing
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: maintai-processing
              key: password
        ports:
        - name: http
          containerPort: 9100
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: tmp
        emptyDir: {}
      - name: kafka-ca
        secret:
          secretName: maintai-kafka-cluster-ca-cert
      - name: rds-ca
        configMap:
          name: aws-rds-ca
