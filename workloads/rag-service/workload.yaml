apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/part-of: maintai
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        maintai.io/config-sha256: 571180f5dd172bf23dc53d8dba1c8db87e41aae47b5676e830871303e0e56fd8
        maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
    spec:
      serviceAccountName: rag-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: rag-service
        image: registry.invalid/maintai/rag-service:UNCONFIGURED
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: rds-ca
          mountPath: /etc/rds-ca
          readOnly: true
        command:
        - python
        - -m
        - maintai_rag.api
        envFrom:
        - configMapRef:
            name: rag-service-config-571180f5dd17
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: knowledge-database
              key: url
        - name: RAG_API_KEY
          valueFrom:
            secretKeyRef:
              name: rag-api-auth
              key: api_key
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-provider
              key: api_key
        ports:
        - name: http
          containerPort: 8002
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: tmp
        emptyDir: {}
      - name: rds-ca
        configMap:
          name: aws-rds-ca
