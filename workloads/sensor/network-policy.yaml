apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sensor
  namespace: maintai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sensor
      app.kubernetes.io/part-of: maintai
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 8005
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ingestion-api
    ports:
    - protocol: TCP
      port: 8000
