apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: sensor
    app.kubernetes.io/part-of: maintai
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        maintai.io/config-sha256: 335af60157b8f115d9cd93e225b08851c707cb472e082ec3429983a36f4e410e
        maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
    spec:
      serviceAccountName: sensor
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sensor
        image: registry.invalid/maintai/sensor:UNCONFIGURED
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: state
          mountPath: /state
        - name: dataset
          mountPath: /data
        command:
        - python
        - -m
        - maintai_sensor.controller
        envFrom:
        - configMapRef:
            name: sensor-config-335af60157b8
        env:
        - name: INGESTION_API_KEY
          valueFrom:
            secretKeyRef:
              name: ingestion-auth
              key: api_key
        ports:
        - name: http
          containerPort: 8005
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
      volumes:
      - name: tmp
        emptyDir: {}
      - name: state
        persistentVolumeClaim:
          claimName: sensor-state
      - name: dataset
        emptyDir: {}
      - name: dataset-lock
        configMap:
          name: maintai-sensor-dataset
      initContainers:
      - name: dataset-download
        image: registry.invalid/maintai/automation:UNCONFIGURED
        command:
        - python
        - -m
        - platform_runtime.artifacts
        - dataset
        - --lock
        - /release/dataset.json
        - --directory
        - /data
        volumeMounts:
        - name: dataset
          mountPath: /data
        - name: dataset-lock
          mountPath: /release
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
