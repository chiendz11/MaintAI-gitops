apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-ui
  namespace: maintai
  labels: &id001
    app.kubernetes.io/name: simulator-ui
    app.kubernetes.io/part-of: maintai
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        maintai.io/config-sha256: 91d167c56f5fd7723761c2084a403bcaa0786b2ff295d90244e8c64c330de3df
        maintai.io/architecture-revision: maintai-1.3.1+simulator-ui.1
    spec:
      serviceAccountName: simulator-ui
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: simulator-ui
        image: registry.invalid/maintai/simulator-ui:UNCONFIGURED
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: runtime-config
          mountPath: /usr/share/nginx/html/runtime-config.json
          subPath: runtime-config.json
          readOnly: true
        env: []
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
