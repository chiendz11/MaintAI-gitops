apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-consumer-config-6e8348363e6f
  namespace: maintai
  labels:
    app.kubernetes.io/name: storage-consumer
    app.kubernetes.io/part-of: maintai
immutable: true
data:
  LOG_LEVEL: INFO
  ENVIRONMENT: production
  KAFKA_BOOTSTRAP_SERVERS: maintai-kafka-kafka-bootstrap.maintai.svc:9093
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: SCRAM-SHA-512
  KAFKA_SSL_CA_LOCATION: /etc/kafka/ca/ca.crt
  KAFKA_ENABLE_AUTO_COMMIT: 'false'
  KAFKA_GROUP_ID: raw-archive-v1
  KAFKA_TOPIC: sensor.readings
  S3_RAW_BUCKET: REPLACE_WITH_RAW_BUCKET
  S3_RAW_PREFIX: raw-sensor/
  ARCHIVE_FORMAT: jsonl.gz
  ARCHIVE_FLUSH_INTERVAL_SECONDS: '5'
